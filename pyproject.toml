[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eblakecarl-costopt_jd126"
version = "0.1.0"
description = "从输入中抽取数值，计算推理成本优化顾问·评测集泄漏与过拟合相关的比值与占比，分母为零时明确报错"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "eblakecarl" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://eblakecarl.github.io"
Repository = "https://github.com/eblakecarl/costopt_jd126"
Issues = "https://github.com/eblakecarl/costopt_jd126/issues"

[project.scripts]
costopt_jd126 = "costopt_jd126:main"

[tool.setuptools]
py-modules = ["costopt_jd126"]
